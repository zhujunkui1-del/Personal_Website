<script>
(function () {
  var P = window.PROTO;
  var all = (window.SITE.projects || []).slice();

  var statLine = document.getElementById('statLine');
  var grid     = document.getElementById('grid');
  var filters  = document.getElementById('filters');
  var sortSel  = document.getElementById('sortSel');
  var hint     = document.getElementById('emptyHint');

  var withCover = all.filter(function (p) { return p.coverSource === 'readme'; }).length;
  var ready     = all.filter(function (p) { return !p.isEmpty; }).length;
  statLine.textContent = '共 ' + all.length + ' 个项目 · ' + withCover + ' 个有封面 · ' + ready + ' 个有正文';

  /* ── 语言筛选芯片 ── */
  var langs = [];
  all.forEach(function (p) {
    (p.languages || []).forEach(function (l) { if (langs.indexOf(l.name) < 0) langs.push(l.name); });
  });
  /* 只保留占比 ≥ 3% 的语言，避免一堆碎芯片 */
  var topLangs = [];
  langs.forEach(function (name) {
    var maxPct = 0;
    all.forEach(function (p) {
      (p.languages || []).forEach(function (l) { if (l.name === name) maxPct = Math.max(maxPct, l.pct); });
    });
    if (maxPct >= 3) topLangs.push(name);
  });

  topLangs.forEach(function (name) {
    var b = document.createElement('button');
    b.className = 'chip';
    b.dataset.lang = name;
    b.textContent = name;
    filters.appendChild(b);
  });

  var activeLang = 'all';
  filters.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-lang]');
    if (!btn) return;
    activeLang = btn.dataset.lang;
    Array.prototype.forEach.call(filters.children, function (c) {
      c.className = (c === btn) ? 'chip chip--solid' : 'chip';
    });
    render();
  });

  sortSel.addEventListener('change', render);

  function render() {
    var list = all.filter(function (p) {
      if (activeLang === 'all') return true;
      return (p.languages || []).some(function (l) { return l.name === activeLang; });
    });

    var mode = sortSel.value;
    list.sort(function (a, b) {
      if (mode === 'updated-desc') return (b.updated || '').localeCompare(a.updated || '');
      if (mode === 'updated-asc')  return (a.updated || '').localeCompare(b.updated || '');
      return a.name.localeCompare(b.name);
    });

    hint.style.display = list.length ? 'none' : 'block';
    grid.innerHTML = list.map(function (p, i) {
      var html = P.cardHtml(p, { blockIndex: i });
      /* 作品列表页的卡多一行「语言分布 + 更新时间」 */
      return html.replace(
        /<div class="card__meta">([\s\S]*?)<\/div>/,
        '<div class="card__meta"><span class="mono mono--sm" style="color:var(--ink-45)">' +
        (p.updated || '—') + '</span><span class="arrow" aria-hidden="true">→</span></div>'
      );
    }).join('');
  }

  render();
})();
</script>
