<script>
  /* 启动页揭示序列（09-动效与交互规格.md §4.1，总计约 1200ms）
     0ms     巨字逐行上推
     400ms   黄带从左扫过（CSS 里已设 delay）
     800ms   副标题淡入
     1000ms  导航 / CTA 出现
  */
  (function () {
    var splash = document.getElementById('splash');
    // 英文行逐字包裹，中文行整行（避免汉字字距抖动）
    var lines = splash.querySelectorAll('.splash__title .reveal-line');
    lines.forEach(function (el) {
      var text = el.textContent;
      var isCJK = /[\u4e00-\u9fa5]/.test(text);
      if (isCJK) return;                     // 中文保持整行
      el.textContent = '';
      Array.prototype.forEach.call(text, function (ch, i) {
        var span = document.createElement('span');
        span.className = 'ch';
        span.style.setProperty('--i', i);
        span.textContent = ch === ' ' ? '\u00a0' : ch;
        el.appendChild(span);
      });
    });

    // 入场
    requestAnimationFrame(function () {
      setTimeout(function () { splash.classList.add('is-in'); }, 60);
    });
  })();
</script>
